name: Validate SkillGraph

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install Pillow==12.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm pass15
      - run: pnpm pass16
      - run: pnpm build
      - run: pnpm --filter @skillgraph/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: git diff --exit-code -- packages/dataset/generated generated docs/map-preview.png
